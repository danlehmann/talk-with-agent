[package]
name = "talk-with-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-avf-audio = { version = "0.3.2", features = ["block2"] }
objc2-foundation = "0.3.2"
objc2-speech = { version = "0.3.2", features = ["block2"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
sherpa-rs = { version = "0.6.8", features = ["static"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
